<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta Recompra CO</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5ddd5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* CONTENEDOR */
#chatbox {
  width: 100%;
  max-width: 420px;
  height: 90vh;
  background: #fff;
  display: flex;
  flex-direction: column;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 15px rgba(0,0,0,0.1);
}

/* HEADER */
#header {
  background: #075e54;
  color: white;
  padding: 15px;
  text-align: center;
  font-weight: bold;
}

/* MENSAJES */
#mensajes {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

/* BURBUJAS */
.mensaje {
  max-width: 75%;
  padding: 10px;
  margin: 5px 0;
  border-radius: 10px;
  font-size: 14px;
}

.bot {
  background: #f0f0f0;
  align-self: flex-start;
}

.user {
  background: #dcf8c6;
  align-self: flex-end;
}

/* INPUT */
#inputArea {
  display: flex;
  padding: 10px;
  background: #f0f0f0;
}

#dui {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 20px;
  outline: none;
}

button {
  margin-left: 10px;
  padding: 10px 15px;
  border: none;
  background: #075e54;
  color: white;
  border-radius: 20px;
  cursor: pointer;
}

/* 📱 MÓVIL */
@media (max-width: 600px) {
  body {
    align-items: stretch;
    height: auto;
  }

  #chatbox {
    height: 100dvh;
    max-width: 100%;
    border-radius: 0;
  }
}
</style>
</head>

<body>

<div id="chatbox">

  <div id="header">Consulta Cliente VIP</div>

  <div id="mensajes">
    <div class="mensaje bot">Hola 👋 Ingresa DUI sin guión para consultar</div>
  </div>

  <div id="inputArea">
    <input type="text" id="dui" placeholder="Ej: 046656807">
    <button onclick="enviar()">Enviar</button>
  </div>

</div>

<script>
let baseDatos = null;

// Cargar JSON una sola vez
function cargarDatos() {
  if (!baseDatos) {
    return fetch('data.json')
      .then(res => res.json())
      .then(data => {
        baseDatos = data;
        return data;
      });
  }
  return Promise.resolve(baseDatos);
}

function enviar() {
  let dui = document.getElementById("dui").value.trim();
  let mensajes = document.getElementById("mensajes");

  if (dui === "") return;

  // Mostrar usuario
  mensajes.innerHTML += '<div class="mensaje user">' + dui + '</div>';

  // Limpiar DUI
  let duiLimpio = dui.replace(/[^0-9]/g, "");

  // Validación básica
  if (duiLimpio.length < 7) {
    mensajes.innerHTML += '<div class="mensaje bot">⚠️ Ingresa un DUI válido</div>';
    return;
  }

  cargarDatos().then(data => {

    if (data[duiLimpio]) {
      mensajes.innerHTML += '<div class="mensaje bot">✅ APLICA RECOMPRA (sujeto análisis)</div>';
    } else {
      mensajes.innerHTML += '<div class="mensaje bot">❌ No aparece como cliente VIP</div>';
    }

    // Scroll automático
    setTimeout(() => {
      mensajes.scrollTop = mensajes.scrollHeight;
    }, 100);
  })
  .catch(() => {
    mensajes.innerHTML += '<div class="mensaje bot">Error al consultar</div>';
  });

  document.getElementById("dui").value = "";
}
</script>

</body>
</html>
